<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Analysis Tool</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .hidden {
            display: none;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1 class="text-center my-4">Audio Analysis Tool</h1>
        <div class="row justify-content-center">
            <div class="col-md-8">
                <form id="uploadForm" enctype="multipart/form-data" class="mb-3">
                    <div class="mb-3">
                        <label for="file" class="form-label">Upload your audio files (WAV or MP3):</label>
                        <input type="file" class="form-control" id="file" name="file" multiple required accept=".wav,.mp3">
                    </div>
                    <button type="submit" class="btn btn-primary">Analyze</button>
                </form>

                <div id="progressBar" class="progress mb-3 hidden">
                    <div class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar" style="width: 0%"></div>
                </div>

                <div id="results" class="hidden">
                    <h2 class="mt-4">Analysis Results</h2>
                    <div id="comparisonCharts"></div>
                    <ul id="fileResults" class="list-group mt-4"></ul>
                    <div class="mt-3">
                        <button id="downloadPdf" class="btn btn-success">Download PDF Report</button>
                        <button id="downloadCsv" class="btn btn-info">Download CSV Data</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('uploadForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const formData = new FormData(this);

            fetch('/', {
                method: 'POST',
                body: formData
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                return response.json();
            })
            .then(data => {
                if (data.task_id) {
                    document.getElementById('progressBar').classList.remove('hidden');
                    checkTaskStatus(data.task_id);
                }
            })
            .catch(error => console.error('Error:', error));
        });

        function checkTaskStatus(taskId) {
            fetch(`/status/${taskId}`)
            .then(response => response.json())
            .then(data => {
                updateProgressBar(data.state, data.current, data.total);
                if (data.state === 'SUCCESS') {
                    displayResults(data.result);
                } else if (data.state !== 'FAILURE') {
                    setTimeout(() => checkTaskStatus(taskId), 1000);
                }
            })
            .catch(error => console.error('Error:', error));
        }

        function updateProgressBar(state, current, total) {
            const progressBar = document.querySelector('.progress-bar');
            let percentage = (current / total) * 100;

            switch(state) {
                case 'PENDING':
                    progressBar.style.width = '25%';
                    progressBar.textContent = 'Pending...';
                    break;
                case 'PROGRESS':
                    progressBar.style.width = `${percentage}%`;
                    progressBar.textContent = `Processing... (${current}/${total})`;
                    break;
                case 'SUCCESS':
                    progressBar.style.width = '100%';
                    progressBar.textContent = 'Complete!';
                    break;
                case 'FAILURE':
                    progressBar.style.width = '100%';
                    progressBar.classList.add('bg-danger');
                    progressBar.textContent = 'Error occurred';
                    break;
            }
        }

        function displayResults(results) {
            document.getElementById('results').classList.remove('hidden');
            const fileResults = document.getElementById('fileResults');
            fileResults.innerHTML = '';

            results.results.forEach(result => {
                const li = document.createElement('li');
                li.className = 'list-group-item';
                li.innerHTML = `
                    <h3>${result.filename}</h3>
                    <ul>
                        <li>True Peak: ${result.analysis.true_peak_dbfs.toFixed(2)} dBFS</li>
                        <li>RMS: ${result.analysis.rms_db.toFixed(2)} dB</li>
                        <li>Loudness (Integrated): ${result.analysis.loudness_integrated.toFixed(2)} LUFS</li>
                        <li>Max Loudness (Momentary): ${result.analysis.max_momentary_loudness.toFixed(2)} LUFS</li>
                        <li>Max Loudness (Short Term): ${result.analysis.max_short_term_loudness.toFixed(2)} LUFS</li>
                    </ul>
                    <img src="data:image/png;base64,${result.waveform_img}" alt="Waveform" class="img-fluid">
                    <img src="data:image/png;base64,${result.spectrogram_img}" alt="Spectrogram" class="img-fluid">
                `;
                fileResults.appendChild(li);
            });

            if (results.comparison_imgs) {
                const comparisonCharts = document.getElementById('comparisonCharts');
                comparisonCharts.innerHTML = '';
                Object.entries(results.comparison_imgs).forEach(([metric, imgData]) => {
                    const div = document.createElement('div');
                    div.className = 'mb-3';
                    div.innerHTML = `
                        <h3>${metric.replace('_', ' ').replace(/^\w/, c => c.toUpperCase())}</h3>
                        <img src="data:image/png;base64,${imgData}" alt="${metric}" class="img-fluid">
                    `;
                    comparisonCharts.appendChild(div);
                });
            }

            document.getElementById('downloadPdf').addEventListener('click', () => {
                const pdfBlob = base64ToBlob(results.pdf, 'application/pdf');
                downloadBlob(pdfBlob, 'audio_analysis.pdf');
            });

            document.getElementById('downloadCsv').addEventListener('click', () => {
                const csvBlob = base64ToBlob(results.csv, 'text/csv');
                downloadBlob(csvBlob, 'audio_analysis.csv');
            });
        }

        function base64ToBlob(base64, mimeType) {
            const byteChars = atob(base64);
            const byteArrays = [];

            for (let offset = 0; offset < byteChars.length; offset += 512) {
                const slice = byteChars.slice(offset, offset + 512);
                const byteNumbers = new Array(slice.length);
                for (let i = 0; i < slice.length; i++) {
                    byteNumbers[i] = slice.charCodeAt(i);
                }
                const byteArray = new Uint8Array(byteNumbers);
                byteArrays.push(byteArray);
            }

            return new Blob(byteArrays, { type: mimeType });
        }

        function downloadBlob(blob, filename) {
            const link = document.createElement('a');
            link.href = window.URL.createObjectURL(blob);
            link.download = filename;
            link.click();
        }
    </script>
</body>

</html>

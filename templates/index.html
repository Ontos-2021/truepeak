<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Analysis Tool</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .hidden {
            display: none;
        }
        #errorMessage {
            color: red;
            margin-top: 10px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1 class="text-center my-4">Audio Analysis Tool</h1>
        <div class="row justify-content-center">
            <div class="col-md-8">
                <form id="uploadForm" enctype="multipart/form-data" class="mb-3">
                    <div class="mb-3">
                        <label for="file" class="form-label">Upload your audio files (WAV or MP3):</label>
                        <input type="file" class="form-control" id="file" name="file" multiple required accept=".wav,.mp3">
                    </div>
                    <button type="submit" class="btn btn-primary" id="analyzeBtn">Analyze</button>
                </form>

                <div id="errorMessage" class="hidden"></div>

                <div id="progressBar" class="progress mb-3 hidden">
                    <div class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar" style="width: 0%"></div>
                </div>

                <div id="results" class="hidden">
                    <h2 class="mt-4">Analysis Results</h2>
                    <div id="comparisonCharts"></div>
                    <ul id="fileResults" class="list-group mt-4"></ul>
                    <div class="mt-3">
                        <button id="downloadPdf" class="btn btn-success">Download PDF Report</button>
                        <button id="downloadCsv" class="btn btn-info">Download CSV Data</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let lastResults = null;

        document.getElementById('uploadForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const formData = new FormData(this);
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.classList.add('hidden');
            errorDiv.textContent = '';

            const progressContainer = document.getElementById('progressBar');
            const progressBar = document.querySelector('.progress-bar');
            progressContainer.classList.remove('hidden');
            progressBar.classList.remove('bg-danger');
            progressBar.style.width = '100%';
            progressBar.textContent = 'Processing...';

            const analyzeBtn = document.getElementById('analyzeBtn');
            analyzeBtn.disabled = true;
            analyzeBtn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Processing...';

            fetch('/analyze', {
                method: 'POST',
                body: formData
            })
            .then(handleResponse)
            .then(data => {
                lastResults = data;
                displayResults(data);
                downloadPdf();
            })
            .catch(error => {
                console.error('Error:', error);
                showError(error.message);
            })
            .finally(() => {
                analyzeBtn.disabled = false;
                analyzeBtn.textContent = 'Analyze';
                progressContainer.classList.add('hidden');
            });
        });

        function handleResponse(response) {
            const contentType = response.headers.get("content-type") || "";
            if (!contentType.includes("application/json")) {
                throw new Error(`Server returned an invalid response (${response.status}). Please try again later.`);
            }
            return response.json().then(data => {
                if (!response.ok) {
                    throw new Error(data.error || `HTTP error! status: ${response.status}`);
                }
                return data;
            });
        }

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.classList.remove('hidden');
            document.getElementById('progressBar').classList.add('hidden');
        }

        function fmt(value) {
            if (value === null || value === undefined) return 'N/A';
            return value.toFixed(2);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = String(text);
            return div.innerHTML;
        }

        function displayResults(results) {
            document.getElementById('results').classList.remove('hidden');
            const fileResults = document.getElementById('fileResults');
            fileResults.innerHTML = '';

            results.results.forEach(result => {
                const li = document.createElement('li');
                li.className = 'list-group-item';

                if (result.error) {
                    li.innerHTML = `
                        <h3>${escapeHtml(result.filename)}</h3>
                        <div class="text-danger">Error: ${escapeHtml(result.error)}</div>
                    `;
                    fileResults.appendChild(li);
                    return;
                }

                const a = result.analysis || {};
                li.innerHTML = `
                    <h3>${escapeHtml(result.filename)}</h3>
                    <ul>
                        <li>True Peak: ${fmt(a.true_peak_dbfs)} dBFS</li>
                        <li>RMS: ${fmt(a.rms_db)} dB</li>
                        <li>Loudness (Integrated): ${fmt(a.loudness_integrated)} LUFS</li>
                        <li>Max Loudness (Momentary): ${fmt(a.max_momentary_loudness)} LUFS</li>
                        <li>Max Loudness (Short Term): ${fmt(a.max_short_term_loudness)} LUFS</li>
                    </ul>
                    <img src="data:image/png;base64,${result.waveform_img}" alt="Waveform" class="img-fluid">
                    <img src="data:image/png;base64,${result.spectrogram_img}" alt="Spectrogram" class="img-fluid">
                `;
                fileResults.appendChild(li);
            });

            const comparisonCharts = document.getElementById('comparisonCharts');
            comparisonCharts.innerHTML = '';
            if (results.comparison_imgs) {
                Object.entries(results.comparison_imgs).forEach(([metric, imgData]) => {
                    const div = document.createElement('div');
                    div.className = 'mb-3';
                    div.innerHTML = `
                        <h3>${metric.replace('_', ' ').replace(/^\w/, c => c.toUpperCase())}</h3>
                        <img src="data:image/png;base64,${imgData}" alt="${metric}" class="img-fluid">
                    `;
                    comparisonCharts.appendChild(div);
                });
            }
        }

        // Bind download buttons once (not per analysis)
        document.getElementById('downloadPdf').addEventListener('click', () => downloadPdf());
        document.getElementById('downloadCsv').addEventListener('click', () => downloadCsv());

        function downloadPdf() {
            if (!lastResults) return;
            fetch('/export/pdf', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    results: lastResults.results,
                    comparison_imgs: lastResults.comparison_imgs || null
                })
            })
            .then(response => {
                if (!response.ok) {
                    return response.json().then(data => {
                        throw new Error(data.error || 'PDF generation failed');
                    });
                }
                return response.blob();
            })
            .then(blob => downloadBlob(blob, 'audio_analysis.pdf'))
            .catch(error => {
                console.error('Error:', error);
                showError(error.message);
            });
        }

        function downloadCsv() {
            if (!lastResults) return;
            fetch('/export/csv', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ results: lastResults.results })
            })
            .then(response => {
                if (!response.ok) {
                    return response.json().then(data => {
                        throw new Error(data.error || 'CSV generation failed');
                    });
                }
                return response.blob();
            })
            .then(blob => downloadBlob(blob, 'audio_analysis.csv'))
            .catch(error => {
                console.error('Error:', error);
                showError(error.message);
            });
        }

        function downloadBlob(blob, filename) {
            const url = window.URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = filename;
            link.click();
            window.setTimeout(() => window.URL.revokeObjectURL(url), 1000);
        }
    </script>
</body>

</html>
